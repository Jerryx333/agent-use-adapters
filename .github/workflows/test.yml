name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-use-adapters
      # 注册表测试会对照 agent-use 核心校验
      - uses: actions/checkout@v4
        with:
          repository: Jerryx333/agent-use
          path: agent-use
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/test.sh
        working-directory: agent-use-adapters
        env:
          AGENT_USE_HOME: ${{ github.workspace }}/agent-use
